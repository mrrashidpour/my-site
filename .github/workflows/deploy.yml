
name: Deploy to Arvan Cloud S3

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: s3

    env:
      # Arvan Cloud Configuration
      AWS_ENDPOINT: https://s3.ir-central1.arvanstorage.ir
      AWS_BUCKET_NAME: mrsite
      AWS_DEFAULT_REGION: ir-central1

      # GitHub Environment Secrets
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify AWS CLI
        run: |
          aws --version

      - name: Verify Configuration
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS_ACCESS_KEY_ID is missing!"
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWS_SECRET_ACCESS_KEY is missing!"
            exit 1
          fi

          echo "AWS configuration is ready."

      - name: Deploy to S3 with public access
        run: |
          # Upload all files and remove deleted files from bucket
          aws s3 sync . "s3://${AWS_BUCKET_NAME}" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --delete \
            --acl public-read \
            --endpoint-url "$AWS_ENDPOINT"

          # Set Cache for HTML files
          aws s3 sync . "s3://${AWS_BUCKET_NAME}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --acl public-read \
            --endpoint-url "$AWS_ENDPOINT"

          # Set Cache for static assets
          aws s3 sync . "s3://${AWS_BUCKET_NAME}" \
            --exclude "*" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.css" \
            --include "*.js" \
            --include "*.webp" \
            --include "*.ico" \
            --cache-control "max-age=86400" \
            --acl public-read \
            --endpoint-url "$AWS_ENDPOINT"

          echo "Deployment completed successfully!"
          echo "Website URL: https://${AWS_BUCKET_NAME}.s3.ir-central1.arvanstorage.ir"
