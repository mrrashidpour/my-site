
name: Deploy to Arvan Cloud S3

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: s3

    env:
      # Arvan Cloud S3 Configuration
      AWS_ENDPOINT: https://s3.ir-central1.arvanstorage.ir
      AWS_DEFAULT_REGION: ir-central1
      AWS_BUCKET_NAME: mrsite

      # GitHub Environment Secrets
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      # 1. Checkout Repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install AWS CLI v2
      - name: Install AWS CLI v2
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"

          unzip -q awscliv2.zip

          sudo ./aws/install

          aws --version

      # 3. Verify Configuration
      - name: Verify AWS Configuration
        shell: bash
        run: |
          set -e

          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "ERROR: AWS_ACCESS_KEY_ID is missing!"
            exit 1
          fi

          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ERROR: AWS_SECRET_ACCESS_KEY is missing!"
            exit 1
          fi

          if [ -z "$AWS_ENDPOINT" ]; then
            echo "ERROR: AWS_ENDPOINT is missing!"
            exit 1
          fi

          if [ -z "$AWS_BUCKET_NAME" ]; then
            echo "ERROR: AWS_BUCKET_NAME is missing!"
            exit 1
          fi

          echo "AWS configuration is ready."

      # 4. Upload HTML Files
      - name: Deploy HTML files
        shell: bash
        run: |
          set -e

          echo "Uploading HTML files..."

          aws s3 sync . "s3://${AWS_BUCKET_NAME}" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --acl public-read \
            --endpoint-url "$AWS_ENDPOINT"

      # 5. Upload Static Assets
      - name: Deploy Static Assets
        shell: bash
        run: |
          set -e

          echo "Uploading static assets..."

          aws s3 sync . "s3://${AWS_BUCKET_NAME}" \
            --exclude "*" \
            --include "*.css" \
            --include "*.js" \
            --include "*.svg" \
            --include "*.png" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.gif" \
            --include "*.webp" \
            --include "*.ico" \
            --cache-control "public, max-age=86400" \
            --acl public-read \
            --endpoint-url "$AWS_ENDPOINT"

      # 6. Deployment Completed
      - name: Deployment Summary
        run: |
          echo "================================"
          echo "Deployment completed!"
          echo "================================"
          echo "Bucket: ${AWS_BUCKET_NAME}"
          echo "Region: ${AWS_DEFAULT_REGION}"
          echo "Endpoint: ${AWS_ENDPOINT}"
          echo "Website: https://${AWS_BUCKET_NAME}.s3.ir-central1.arvanstorage.ir"
